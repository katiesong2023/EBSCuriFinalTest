<text x="40" y="1329" font-size="18" font-weight="400">human_review_ref → 기존 검토 또는 relationReviews.reviewId · resources.id는 통합 검색 자료 ID이며 방송 DB FK가 아님</text>
<text x="40" y="1365" font-size="17" font-weight="400" style="fill:#64748b">근거·인용·검사는 relations.evidence JSON에 보존 · 별도 근거/검사 테이블 및 사용자 테이블은 없음</text>
