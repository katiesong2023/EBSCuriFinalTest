<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curi 수업 자료 저장</title><link rel="stylesheet" href="http://127.0.0.1:3020/curi-tokens.css"><link rel="stylesheet" href="http://127.0.0.1:3020/popup.css?v=063"></head>
<body>
<header class="popup-header"><img src="http://127.0.0.1:3020/brand/curi-symbol-green.svg" width="24" height="24" alt=""><h1>curi <span>수업 자료 가져가기 · 사이드 패널</span></h1></header>
<details><summary>Curi 연결 주소</summary><label>Curi 주소<input id="origin" placeholder="http://localhost:3000"></label></details><button id="connect" type="button">Curi 연결·폴더 불러오기</button>
<p id="status" role="status" aria-live="polite">표시 시안 · 실제 저장은 실행하지 않습니다.</p>
<section class="current-video" aria-labelledby="video-heading"><div class="video-heading-row"><h2 id="video-heading">현재 영상</h2><button id="refresh-source" class="icon-button" type="button" aria-label="영상 목록 새로고침" title="영상 목록 새로고침"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div><label class="video-select-label"><span class="sr-only">저장할 영상 선택</span><select id="video-tab" hidden></select></label><p id="video">덩이랑 쾡이랑 인물 한국사
세종대왕 1부 책을 사랑한 셋째아들</p>
</section>
<section aria-labelledby="folder-heading"><h2 id="folder-heading">가져갈 수업 폴더</h2>
<label>저장할 수업 폴더<select id="folder"></select></label>
<form id="folder-form" novalidate><label for="new-folder-title">새 폴더 이름</label><div class="folder-name-control"><input id="new-folder-title" maxlength="200" placeholder="예: 조선시대"><button id="create-folder" type="submit" disabled>생성</button></div></form></section>
<section aria-labelledby="import-heading"><h2 id="import-heading">수업에 가져가기</h2>
<div class="import-tabs" role="tablist" aria-label="가져갈 범위">
<button id="whole-mode" type="button" role="tab" aria-selected="true" aria-controls="whole-panel" tabindex="0">영상 전체</button>
<button id="segment-mode" type="button" role="tab" aria-selected="false" aria-controls="segment-panel" tabindex="-1">구간 지정</button>
</div>
<form id="save-form" novalidate>
<div id="whole-panel" role="tabpanel" aria-labelledby="whole-mode"><p class="help">선택한 폴더에 영상 전체의 원본 링크를 가져갑니다.</p></div>
<div id="segment-panel" role="tabpanel" aria-labelledby="segment-mode" hidden><p class="help">원본 링크와 시작·끝 시간을 함께 가져갑니다.</p>
<label>구간 이름<input id="name" maxlength="200"></label>
<div class="times"><label>시작 (분:초 / 초)<input id="start" placeholder="0:00"></label><button id="set-start" type="button">현재 시간을 시작으로</button></div>
<div class="times"><label>끝 (분:초 / 초)<input id="end" placeholder="1:00"></label><button id="set-end" type="button">현재 시간을 끝으로</button></div>
<p id="player-status" class="help">시간을 직접 입력하거나 영상의 현재 시간을 가져오세요.</p><label>구간 메모<textarea id="note" maxlength="4000" rows="2"></textarea></label>
<button id="new" type="button">새 구간</button></div>
<button id="save" type="submit" disabled>영상 전체 가져가기</button><p id="save-feedback" class="save-feedback" role="status"></p></form></section>
<script>
// 표시 시안은 탭 배치만 전환하며 연결/저장 API를 사용하지 않는다.
for(const mode of ['whole','segment'])document.querySelector('#'+mode+'-mode').addEventListener('click',()=>{
 for(const value of ['whole','segment']){document.querySelector('#'+value+'-mode').setAttribute('aria-selected',String(value===mode));document.querySelector('#'+value+'-panel').hidden=value!==mode;}
 document.querySelector('#save').textContent=mode==='segment'?'영상과 구간 가져가기':'영상 전체 가져가기';
});
</script></body></html>
